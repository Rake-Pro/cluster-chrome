name: Release

# A promotion PR merging into main mints the next semver tag and builds both
# images from it in one run (a tag pushed with GITHUB_TOKEN cannot trigger
# another workflow). Label the PR release:minor / release:major to change the
# bump; default is patch. A manually pushed v* tag also builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_CHROME: ghcr.io/rake-pro/cluster-chrome
  IMAGE_PLUGIN: ghcr.io/rake-pro/cluster-chrome-dri-plugin

jobs:
  version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute and push next version tag
        id: next
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            echo "HEAD already tagged; skipping release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "${latest}" ]; then
            next="v1.0.0"
          else
            labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[].labels[].name] | join(",")' || echo "")
            bump=patch
            case ",${labels}," in
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
            esac
            IFS=. read -r ma mi pa <<< "${latest#v}"
            case "${bump}" in
              major) next="v$((ma+1)).0.0" ;;
              minor) next="v${ma}.$((mi+1)).0" ;;
              patch) next="v${ma}.${mi}.$((pa+1))" ;;
            esac
          fi
          git tag "${next}" "${GITHUB_SHA}"
          git push origin "refs/tags/${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: always() && (needs.version.outputs.tag != '' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rel.outputs.version }}
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="${{ needs.version.outputs.tag }}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.rel.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chrome image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHROME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
      - name: Build and push chrome image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Plugin image metadata
        id: meta_plugin
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PLUGIN }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
      - name: Build and push DRI device plugin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.plugin
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta_plugin.outputs.tags }}
          labels: ${{ steps.meta_plugin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_CHROME }}:${{ needs.build.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PLUGIN }}:${{ needs.build.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
